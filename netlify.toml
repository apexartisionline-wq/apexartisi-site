# Δοκιμαστική εγκατάσταση στο Netlify (μόνο με ψεύτικα στοιχεία· οι functions τρέχουν εκτός ΕΕ).
# Θεματικές της εβδομάδας από αρχεία (content/thematikes, 22/10): import-thematikes πριν το build.
[build]
  command = "npx prisma migrate deploy && npx tsx prisma/demo-wipe.ts && npx tsx prisma/demo-reset.ts && npx tsx prisma/demo.ts && npx tsx prisma/demo-history.ts && npx tsx prisma/demo-journal.ts && npx tsx prisma/demo-steps.ts && npx tsx prisma/demo-today.ts && npx tsx prisma/import-thematikes.ts && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
