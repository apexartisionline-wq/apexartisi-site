# Δοκιμαστική εγκατάσταση στο Netlify (μόνο με ψεύτικα στοιχεία· οι functions τρέχουν εκτός ΕΕ).
[build]
  command = "npx prisma migrate deploy && npx tsx prisma/demo.ts && npx tsx prisma/demo-history.ts && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
